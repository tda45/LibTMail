[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mysql]
command=/usr/bin/mysql_safe
autostart=true
autorestart=true
priority=100
stdout_logfile=/var/log/supervisor/mysql.log
stderr_logfile=/var/log/supervisor/mysql.log

[program:postfix]
command=/usr/sbin/postfix start -c /etc/postfix
autostart=true
autorestart=true
priority=200
stdout_logfile=/var/log/supervisor/postfix.log
stderr_logfile=/var/log/supervisor/postfix.log

[program:dovecot]
command=/usr/sbin/dovecot -c /etc/dovecot/dovecot.conf
autostart=true
autorestart=true
priority=200
stdout_logfile=/var/log/supervisor/dovecot.log
stderr_logfile=/var/log/supervisor/dovecot.log

[program:spamassassin]
command=/usr/sbin/spamd --max-children 5 --helper-home-dir
autostart=true
autorestart=true
priority=300
stdout_logfile=/var/log/supervisor/spamassassin.log
stderr_logfile=/var/log/supervisor/spamassassin.log

[program:clamav-daemon]
command=/usr/sbin/clamd
autostart=true
autorestart=true
priority=300
stdout_logfile=/var/log/supervisor/clamav.log
stderr_logfile=/var/log/supervisor/clamav.log

[program:clamsmtp]
command=/usr/sbin/clamsmtpd
autostart=true
autorestart=true
priority=300
stdout_logfile=/var/log/supervisor/clamsmtp.log
stderr_logfile=/var/log/supervisor/clamsmtp.log

[program:opendkim]
command=/usr/sbin/opendkim -x /etc/opendkim.conf
autostart=true
autorestart=true
priority=300
stdout_logfile=/var/log/supervisor/opendkim.log
stderr_logfile=/var/log/supervisor/opendkim.log

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
priority=400
stdout_logfile=/var/log/supervisor/apache2.log
stderr_logfile=/var/log/supervisor/apache2.log

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
priority=500
stdout_logfile=/var/log/supervisor/cron.log
stderr_logfile=/var/log/supervisor/cron.log

[program:freshclam]
command=/usr/bin/freshclam -d
autostart=true
autorestart=true
priority=600
stdout_logfile=/var/log/supervisor/freshclam.log
stderr_logfile=/var/log/supervisor/freshclam.log
